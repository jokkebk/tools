function invert(o,m){
  const a=m;
  const b00=a[0]*a[5]-a[1]*a[4], b01=a[0]*a[6]-a[2]*a[4], b02=a[0]*a[7]-a[3]*a[4],
        b03=a[1]*a[6]-a[2]*a[5], b04=a[1]*a[7]-a[3]*a[5], b05=a[2]*a[7]-a[3]*a[6],
        b06=a[8]*a[13]-a[9]*a[12], b07=a[8]*a[14]-a[10]*a[12], b08=a[8]*a[15]-a[11]*a[12],
        b09=a[9]*a[14]-a[10]*a[13], b10=a[9]*a[15]-a[11]*a[13], b11=a[10]*a[15]-a[11]*a[14];
  let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if(!det) return o; det=1/det;
  o[0]=(a[5]*b11-a[6]*b10+a[7]*b09)*det;  o[1]=(a[2]*b10-a[1]*b11-a[3]*b09)*det;
  o[2]=(a[13]*b05-a[14]*b04+a[15]*b03)*det; o[3]=(a[10]*b04-a[9]*b05-a[11]*b03)*det;
  o[4]=(a[6]*b08-a[4]*b11-a[7]*b07)*det;  o[5]=(a[0]*b11-a[2]*b08+a[3]*b07)*det;
  o[6]=(a[14]*b02-a[12]*b05-a[15]*b01)*det; o[7]=(a[8]*b05-a[10]*b02+a[11]*b01)*det;
  o[8]=(a[4]*b10-a[5]*b08+a[7]*b06)*det;  o[9]=(a[1]*b08-a[0]*b10-a[3]*b06)*det;
  o[10]=(a[12]*b04-a[13]*b02+a[15]*b00)*det; o[11]=(a[9]*b02-a[8]*b04-a[11]*b00)*det;
  o[12]=(a[5]*b07-a[4]*b09-a[6]*b06)*det; o[13]=(a[0]*b09-a[1]*b07+a[2]*b06)*det;
  o[14]=(a[13]*b01-a[12]*b03-a[14]*b00)*det; o[15]=(a[8]*b03-a[9]*b01+a[10]*b00)*det;
  return o;
}

let lightDir=[0,-1,0], lightCol=[1,1,1], sigma=[0.2,0.1,0.08];
let deepCol=[0.01,0.03,0.04], shallowCol=[0.05,0.13,0.15];

function setCommon(prog){
  const u=prog.u;
  if(u.uTime) gl.uniform1f(u.uTime, T);
  if(u.uCamPos) gl.uniform3fv(u.uCamPos, camPosU);
  if(u.uLightDir) gl.uniform3fv(u.uLightDir, lightDir);
  if(u.uLightCol) gl.uniform3fv(u.uLightCol, lightCol);
  if(u.uSigma) gl.uniform3fv(u.uSigma, sigma);
  if(u.uDeepCol) gl.uniform3fv(u.uDeepCol, deepCol);
  if(u.uShallowCol) gl.uniform3fv(u.uShallowCol, shallowCol);
  if(u.uWaterY) gl.uniform1f(u.uWaterY, W.waterY);
  if(u.uCaustAmt) gl.uniform1f(u.uCaustAmt, P.caustics);
  if(u.uCaustDepth) gl.uniform1f(u.uCaustDepth, W.waterY - W.sandY);
  if(u.uCaustNorm) gl.uniform1f(u.uCaustNorm, caustNorm);
  if(u.uTileInv) gl.uniform1f(u.uTileInv, 1/W.tile);
  if(u.uLightVP) gl.uniformMatrix4fv(u.uLightVP, false, lightVP);
  if(u.uClip) gl.uniform2f(u.uClip, clipOn, clipSign);
  bindTex(prog,'uCaustTex',6,caustTex);
  bindTex(prog,'uShadowMap',7,shadowTex);
}
let clipOn=0, clipSign=1;
let camPosU=new Float32Array(3);
const camFwd=[0,0,-1];
let T=0;

/* ================================================================= frame */
let last=performance.now()*0.001, acc=0, frames=0, fpsT=0, fps=60, slowFrames=0;
const fpsEl=document.getElementById('fps');

function updateSim(dt){
  const t=T;
  const live = P.liveliness;

  /* ---- fish: boids with species-specific personality -------------------- */
  const foodActive = food.length>0;
  for(const S of SPECIES){
    const arr=S.fish;
    const sepR = S.size*2.6, nbrR = S.size*7.5;
    for(let i=0;i<arr.length;i++){
      const f=arr[i];
      let ax=0, ay=0, az=0;
      let cx=0, cy=0, cz=0, avx=0, avy=0, avz=0, cnt=0;
      for(let j=0;j<arr.length;j++){
        if(i===j) continue;
        const o=arr[j];
        const dx=o.x-f.x, dy=o.y-f.y, dz=o.z-f.z;
        const d2=dx*dx+dy*dy+dz*dz;
        if(d2 > nbrR*nbrR || d2<1e-8) continue;
        const d=Math.sqrt(d2);
        if(d<sepR){ const k=(sepR-d)/sepR*2.4; ax-=dx/d*k; ay-=dy/d*k; az-=dz/d*k; }
        cx+=o.x; cy+=o.y; cz+=o.z; avx+=o.vx; avy+=o.vy; avz+=o.vz; cnt++;
      }
      const sch = S.school*P.schooling;
      if(cnt>0 && sch>0.01){
        cx/=cnt; cy/=cnt; cz/=cnt;
        ax+=(cx-f.x)*0.55*sch; ay+=(cy-f.y)*0.55*sch; az+=(cz-f.z)*0.55*sch;
        const al=Math.hypot(avx,avy,avz)||1;
        ax+=(avx/al - f.vx/(Math.hypot(f.vx,f.vy,f.vz)||1))*0.9*sch;
        ay+=(avy/al - f.vy/(Math.hypot(f.vx,f.vy,f.vz)||1))*0.9*sch;
        az+=(avz/al - f.vz/(Math.hypot(f.vx,f.vy,f.vz)||1))*0.9*sch;
      }
      // wander
      ax += Math.sin(t*0.7+f.phase)*0.5 + Math.sin(t*1.9+f.phase*2.3)*0.22;
      ay += Math.sin(t*0.53+f.phase*1.7)*0.18;
      az += Math.cos(t*0.61+f.phase*1.3)*0.35;
      // preferred depth band
      const yWant = lerp(W.sandY+0.10, W.waterY-0.16, lerp(S.yBias[0],S.yBias[1],0.5+0.5*Math.sin(t*0.13+f.phase)));
      ay += (yWant - f.y)*1.05;
      // current
      const fl = flowField(f.x,f.y,f.z,t);
      ax += fl[0]*0.22*P.current; ay += fl[1]*0.22*P.current; az += fl[2]*0.22*P.current;
      // walls
      const m=0.55;
      if(f.x >  W.halfX-m) ax -= (f.x-(W.halfX-m))*5.0;
      if(f.x < -W.halfX+m) ax -= (f.x+(W.halfX-m))*5.0;
      if(f.z >  W.zFront-0.35) az -= (f.z-(W.zFront-0.35))*7.0;
      if(f.z <  W.zBack+0.30)  az -= (f.z-(W.zBack+0.30))*7.0;
      const floorY = sandH(f.x,f.z)+S.size*0.55;
      if(f.y < floorY+0.12) ay += (floorY+0.12-f.y)*9.0;
      if(f.y > W.waterY-0.16) ay -= (f.y-(W.waterY-0.16))*9.0;
      // rocks
      for(const r of rocks.list){
        if(r.s<0.2) continue;
        const dx=f.x-r.x, dy=f.y-r.y, dz=f.z-r.z;
        const d=Math.hypot(dx,dy,dz), lim=r.s*1.5+S.size;
        if(d<lim && d>1e-4){ const k=(lim-d)/lim*6.0; ax+=dx/d*k; ay+=dy/d*k; az+=dz/d*k; }
      }
      // food
      f.boost = Math.max(0, f.boost-dt*0.8);
      if(foodActive){
        let best=null, bd=2.6*2.6;
        for(const fd of food){
          const dx=fd.x-f.x, dy=fd.y-f.y, dz=fd.z-f.z, d2=dx*dx+dy*dy+dz*dz;
          if(d2<bd){ bd=d2; best=fd; }
        }
        if(best){
          const d=Math.sqrt(bd)||1;
          const k = 5.5*clamp(1.6/d,0.4,2.2);
          ax+=(best.x-f.x)/d*k; ay+=(best.y-f.y)/d*k; az+=(best.z-f.z)/d*k;
          f.boost=1;
          if(d < f.size*0.75){ best.life=-1; }
        }
      }
      const spd0 = S.speed*live*(1+f.boost*1.25);
      f.vx += ax*dt*2.2; f.vy += ay*dt*2.2; f.vz += az*dt*2.2;
      // damping + speed control
      let sp=Math.hypot(f.vx,f.vy,f.vz)||1e-5;
      const want = clamp(spd0*(0.75+0.5*Math.abs(Math.sin(t*0.4+f.phase))), 0.02, 4.0);
      const ns = lerp(sp, want, clamp(dt*2.4,0,1));
      f.vx*=ns/sp; f.vy*=ns/sp; f.vz*=ns/sp;
      f.vy = clamp(f.vy, -want*0.7, want*0.7);
      f.x+=f.vx*dt; f.y+=f.vy*dt; f.z+=f.vz*dt;

      // heading, banking, body curvature
      sp=Math.hypot(f.vx,f.vy,f.vz)||1e-5;
      const nfx=f.vx/sp, nfy=f.vy/sp, nfz=f.vz/sp;
      const turn = nfx*f.fz - nfz*f.fx;               // signed yaw change
      const k2=clamp(dt*7.0,0,1);
      f.fx=lerp(f.fx,nfx,k2); f.fy=lerp(f.fy,nfy,k2); f.fz=lerp(f.fz,nfz,k2);
      const fl2=Math.hypot(f.fx,f.fy,f.fz)||1; f.fx/=fl2; f.fy/=fl2; f.fz/=fl2;
      f.roll = lerp(f.roll, clamp(-turn*9.0, -0.7, 0.7), clamp(dt*3.0,0,1));
      f.bend = lerp(f.bend, clamp(turn*3.2,-0.35,0.35), clamp(dt*4.0,0,1));
      f.beat = S.beat*(0.55 + 0.9*(ns/Math.max(S.speed,0.01))/live*live) * (0.85+0.35*f.boost);
    }
  }

  /* ---- food ------------------------------------------------------------- */
  for(let i=food.length-1;i>=0;i--){
    const fd=food[i];
    fd.life-=dt;
    const fl=flowField(fd.x,fd.y,fd.z,t);
    fd.vx = lerp(fd.vx, fl[0]*0.10*P.current, dt*2);
    fd.vz = lerp(fd.vz, fl[2]*0.10*P.current, dt*2);
    fd.vy = lerp(fd.vy, -0.075, dt*1.5);
    fd.x+=fd.vx*dt; fd.y+=fd.vy*dt; fd.z+=fd.vz*dt;
    fd.spin += fd.spinV*dt;
    const gy=sandH(fd.x,fd.z)+0.012;
    if(fd.y<gy){ fd.y=gy; fd.vy=0; fd.life=Math.min(fd.life, 6); }
    if(fd.life<=0) food.splice(i,1);
  }

  /* ---- bubbles ---------------------------------------------------------- */
  bubbleAcc += dt*P.bubbles*46;
  while(bubbleAcc>=1){
    bubbleAcc-=1;
    if(bubbles.length<MAXBUB){
      const src = rnd()<0.55 ? AIRSTONE : AIRSTONE2;
      bubbles.push({ x:src.x+rr(-0.10,0.10), y:src.y, z:src.z+rr(-0.06,0.06),
        r:rr(0.007,0.024), p:rr(0,TAU), w:rr(1.6,3.4), vy:0 });
    }
  }
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];
    b.vy = lerp(b.vy, 0.30+b.r*13.0, dt*3.0);
    b.y += b.vy*dt;
    b.p += dt*b.w;
    const fl=flowField(b.x,b.y,b.z,t);
    b.x += (Math.sin(b.p)*0.055 + fl[0]*0.10*P.current)*dt*3.0;
    b.z += (Math.cos(b.p*0.8)*0.04 + fl[2]*0.10*P.current)*dt*3.0;
    b.r += dt*0.0016;
    if(b.y > W.waterY-b.r*0.5) bubbles.splice(i,1);
  }

  /* ---- marine snow ------------------------------------------------------ */
  for(const s of snow){
    const fl=flowField(s.x,s.y,s.z,t);
    s.x += (fl[0]*0.055*P.current + Math.sin(t*0.6+s.p)*0.006)*dt*3.0;
    s.y += (s.vy + fl[1]*0.03*P.current)*dt*3.0;
    s.z += (fl[2]*0.05*P.current)*dt*3.0;
    if(s.x>8.5) s.x=-8.5; if(s.x<-8.5) s.x=8.5;
    if(s.y<W.sandY-0.05){ s.y=W.waterY-0.02; }
    if(s.y>W.waterY) s.y=W.sandY;
    if(s.z>W.zFront+0.7) s.z=W.zBack-1.5;
    if(s.z<W.zBack-1.6) s.z=W.zFront+0.6;
  }
}

/* -------------------------------------------------------- buffer uploads */
function uploadFish(){
  for(const S of SPECIES){
    const d=S.instData;
    S.fish.forEach((f,i)=>{
      const o=i*16;
      d[o]=f.x; d[o+1]=f.y; d[o+2]=f.z; d[o+3]=f.size;
      d[o+4]=f.fx; d[o+5]=f.fy; d[o+6]=f.fz; d[o+7]=f.roll;
      d[o+8]=f.phase; d[o+9]=f.beat||S.beat; d[o+10]=f.bend; d[o+11]=S.waveAmp;
      d[o+12]=f.tint[0]; d[o+13]=f.tint[1]; d[o+14]=f.tint[2]; d[o+15]=f.variant;
    });
    gl.bindBuffer(gl.ARRAY_BUFFER, S.instBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, d, 0, S.fish.length*16);
  }
}
function uploadBillboards(){
  const bd=bubbleGL.data;
  bubbles.forEach((b,i)=>{ const o=i*4; bd[o]=b.x; bd[o+1]=b.y; bd[o+2]=b.z; bd[o+3]=b.r; });
  gl.bindBuffer(gl.ARRAY_BUFFER, bubbleGL.buf);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,bd,0,Math.max(bubbles.length*4,4));

  const fd=foodGL.data;
  food.forEach((f,i)=>{ const o=i*8;
    fd[o]=f.x; fd[o+1]=f.y; fd[o+2]=f.z; fd[o+3]=f.r;
    fd[o+4]=Math.cos(f.spin); fd[o+5]=Math.sin(f.spin); fd[o+6]=f.tint; fd[o+7]=0; });
  gl.bindBuffer(gl.ARRAY_BUFFER, foodGL.buf);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,fd,0,Math.max(food.length*8,8));

  const sd=snowGL.data;
  const nSnow = Math.floor(MAXSNOW*clamp(P.motes,0,2)/2*1.0);
  for(let i=0;i<nSnow;i++){ const s=snow[i], o=i*4;
    sd[o]=s.x; sd[o+1]=s.y; sd[o+2]=s.z; sd[o+3]=s.s; }
  gl.bindBuffer(gl.ARRAY_BUFFER, snowGL.buf);
  if(nSnow>0) gl.bufferSubData(gl.ARRAY_BUFFER,0,sd,0,nSnow*4);
  return nSnow;
}

/* ------------------------------------------------------------- draw sets */
function drawWorld(mvp, opts){
  const shadow = opts.shadow;
  // sand
  if(!shadow){
    gl.useProgram(progSand.p);
    gl.uniformMatrix4fv(progSand.u.uVP,false,mvp);
    setCommon(progSand);
    gl.uniform4fv(progSand.u.uRocks, rocks.rockU);
    gl.uniform1i(progSand.u.uRockCount, rocks.rockCount);
    gl.bindVertexArray(sand.vao);
    gl.drawElements(gl.TRIANGLES, sand.count, gl.UNSIGNED_INT, 0);

    gl.useProgram(progBack.p);
    gl.uniformMatrix4fv(progBack.u.uVP,false,mvp);
    setCommon(progBack);
    gl.bindVertexArray(backdrop.vao);
    gl.drawArrays(gl.TRIANGLES,0,backdrop.count);
  }
  // rocks
  const pr = shadow ? progRockShadow : progRock;
  gl.useProgram(pr.p);
  gl.uniformMatrix4fv(pr.u.uVP,false,mvp);
  if(!shadow) setCommon(pr);
  gl.bindVertexArray(rocks.vao);
  gl.drawElementsInstanced(gl.TRIANGLES, rocks.count, gl.UNSIGNED_SHORT, 0, rocks.n);

  // plants
  const nPlants = Math.floor(plants.n * clamp(P.plants,0,1));
  if(nPlants>0){
    const pp = shadow ? progPlantShadow : progPlant;
    gl.useProgram(pp.p);
    gl.uniformMatrix4fv(pp.u.uVP,false,mvp);
    gl.uniform1f(pp.u.uTime, T);
    gl.uniform1f(pp.u.uCurrent, P.current);
    if(!shadow) setCommon(pp);
    gl.bindVertexArray(plants.vao);
    gl.disable(gl.CULL_FACE);
    gl.drawElementsInstanced(gl.TRIANGLES, plants.count, gl.UNSIGNED_SHORT, 0, nPlants);
    if(!opts.noCull) gl.enable(gl.CULL_FACE);
  }

  // fish bodies
  const pf = shadow ? progFishShadow : progFish;
  gl.useProgram(pf.p);
  gl.uniformMatrix4fv(pf.u.uVP,false,mvp);
  gl.uniform1f(pf.u.uTime, T);
  if(!shadow) setCommon(pf);
  gl.disable(gl.CULL_FACE);
  for(const S of SPECIES){
    if(!S.fish.length) continue;
    if(!shadow){ gl.uniform1i(pf.u.uSpecies, S.id); gl.uniform1f(pf.u.uFinPass, 0); }
    gl.bindVertexArray(S.vao);
    const count = shadow ? (S.mesh3.bodyCount+S.mesh3.finCount) : S.mesh3.bodyCount;
    gl.drawElementsInstanced(gl.TRIANGLES, count, gl.UNSIGNED_SHORT, 0, S.fish.length);
  }
  if(!opts.noCull) gl.enable(gl.CULL_FACE);
}

function drawFins(mvp){
  gl.useProgram(progFish.p);
  gl.uniformMatrix4fv(progFish.u.uVP,false,mvp);
  gl.uniform1f(progFish.u.uTime, T);
  setCommon(progFish);
  gl.uniform1f(progFish.u.uFinPass, 1);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  for(const S of SPECIES){
    if(!S.fish.length) continue;
    gl.uniform1i(progFish.u.uSpecies, S.id);
    gl.bindVertexArray(S.vao);
    gl.drawElementsInstanced(gl.TRIANGLES, S.mesh3.finCount, gl.UNSIGNED_SHORT,
      S.mesh3.bodyCount*2, S.fish.length);
  }
  gl.depthMask(true);
  gl.disable(gl.BLEND);
}

function fullscreen(prog, fboTarget, w, h){
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboTarget);
  gl.viewport(0,0,w,h);
  gl.useProgram(prog.p);
  gl.disable(gl.DEPTH_TEST);
  gl.bindVertexArray(quadVAO);
}

/* ==================================================================== run */
function frame(now){
  requestAnimationFrame(frame);
  now *= 0.001;
  let dt = Math.min(now-last, 0.05); last=now;
  if(dt<=0) dt=1/60;
  T += dt;

  if(needResize || lastQuality!==P.quality){ needResize=false; lastQuality=P.quality; resize(); }

  frames++; fpsT+=dt;
  if(fpsT>0.5){ fps = frames/fpsT; frames=0; fpsT=0;
    fpsEl.textContent = fps.toFixed(0)+' fps';
    // gentle auto-throttle so it stays smooth on modest hardware
    if(fps<40){ slowFrames++; if(slowFrames>3 && P.quality>0.6){
        P.quality=Math.max(0.6, P.quality-0.12); sliderEls.quality.sync(); needResize=true; slowFrames=0; } }
    else slowFrames=0;
  }

  /* ---- lighting from the sliders --------------------------------------- */
  const warm = P.warmth;
  const lc = [lerp(0.78,1.14,warm), lerp(0.97,0.99,warm), lerp(1.22,0.82,warm)];
  const li = P.light*2.15;
  lightCol = [lc[0]*li, lc[1]*li, lc[2]*li];
  const tl = P.tilt;
  {
    const d=[tl*0.42, -1.0, -0.16+tl*0.1];
    const l=Math.hypot(d[0],d[1],d[2]); lightDir=[d[0]/l,d[1]/l,d[2]/l];
  }
  const turb = 1.0 - P.clarity;
  sigma = [ (0.030 + turb*0.30), (0.012 + turb*0.20), (0.009 + turb*0.17) ];
  const amb = 0.5 + P.light*0.55;
  deepCol    = [0.004*amb, 0.021*amb, 0.030*amb];
  shallowCol = [ (0.012+turb*0.035)*amb, (0.098+turb*0.055)*amb, (0.128+turb*0.050)*amb ];

  /* ---- camera ----------------------------------------------------------- */
  mouseX = lerp(mouseX, mouseTX, clamp(dt*1.6,0,1));
  mouseY = lerp(mouseY, mouseTY, clamp(dt*1.6,0,1));
  const dr = P.drift;
  const bob = Math.sin(T*0.117)*0.34 + Math.sin(T*0.041+1.3)*0.22;
  const bob2= Math.cos(T*0.093+0.7)*0.10 + Math.sin(T*0.163)*0.05;
  // A tall frame sees the same slice of water but a much narrower slice of
  // tank, so it reads as empty. Come in closer and look down a little.
  const portrait = clamp((1.25 - RW/RH)/0.85, 0, 1);
  const zoomD = lerp(4.4, 1.9, (P.zoom-0.55)/1.15) * (1.0 - 0.24*portrait);
  cam.pos[0] = bob*dr*0.55 + mouseX*0.42;
  cam.pos[1] = 1.20 + bob2*dr*0.5 - mouseY*0.30 - 0.10*portrait;
  cam.pos[2] = zoomD + Math.sin(T*0.071)*0.16*dr;
  cam.target[0] = bob*dr*0.22 + mouseX*0.55;
  cam.target[1] = 1.26 + Math.sin(T*0.087+2.0)*0.07*dr - mouseY*0.42 - 0.34*portrait;
  cam.target[2] = -0.3;
  camPosU[0]=cam.pos[0]; camPosU[1]=cam.pos[1]; camPosU[2]=cam.pos[2];
  camFwd[0]=cam.target[0]-cam.pos[0]; camFwd[1]=cam.target[1]-cam.pos[1]; camFwd[2]=cam.target[2]-cam.pos[2];
  { const l=Math.hypot(camFwd[0],camFwd[1],camFwd[2])||1;
    camFwd[0]/=l; camFwd[1]/=l; camFwd[2]/=l; }

  const aspect = RW/RH;
  perspective(proj, cam.fov, aspect, NEAR, FAR);
  lookAt(view, cam.pos, cam.target, [0,1,0]);
  mul(vp, proj, view);
  invert(invVP, vp);

  /* ---- light matrix ----------------------------------------------------- */
  {
    const c=[0,(W.waterY+W.sandY)*0.5,-0.1];
    const e=[c[0]-lightDir[0]*4.0, c[1]-lightDir[1]*4.0, c[2]-lightDir[2]*4.0];
    lookAt(lview, e, c, [0,0,1]);
    ortho(lproj, -6.2, 6.2, -3.0, 3.0, 0.4, 9.0);
    mul(lightVP, lproj, lview);
  }

  updateSim(dt);
  uploadFish();
  const nSnow = uploadBillboards();

  /* ---- pass 0: caustics -------------------------------------------------
     splat the refracted surface grid once per wavelength; blue bends hardest,
     exaggerated a little so the fringes survive tonemapping                  */
  gl.bindFramebuffer(gl.FRAMEBUFFER, caustFBO);
  gl.viewport(0,0,CAUST_SIZE,CAUST_SIZE);
  gl.disable(gl.DEPTH_TEST);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progSplat.p);
  gl.uniform1f(progSplat.u.uTime, T);
  gl.uniform1f(progSplat.u.uChop, P.chop);
  gl.uniform1f(progSplat.u.uDepth, W.waterY-W.sandY);
  gl.uniform1f(progSplat.u.uTile, W.tile);
  const splat = P.quality < 0.8 ? splatGrid.coarse : splatGrid.fine;
  gl.uniform1f(progSplat.u.uMaxI, splat.maxI);
  gl.uniform1f(progSplat.u.uSoft, 0.055);
  gl.uniform1f(progSplat.u.uStep, splat.step);
  gl.uniform4fv(progSplat.u.uPhaseStep, splat.phaseStep);
  gl.uniform3fv(progSplat.u.uLightDir, lightDir);
  gl.bindVertexArray(splatGrid.vao);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, splat.buf);
  const IOR = [1.3330 - 0.0042, 1.3330, 1.3330 + 0.0055];
  for(let ch=0; ch<3; ch++){
    gl.colorMask(ch===0, ch===1, ch===2, false);
    gl.uniform1f(progSplat.u.uEta, 1.0/IOR[ch]);
    gl.drawElements(gl.TRIANGLES, splat.count, gl.UNSIGNED_INT, 0);
  }
  gl.colorMask(true,true,true,true);
  gl.disable(gl.BLEND);
  gl.bindTexture(gl.TEXTURE_2D, caustTex);
  gl.generateMipmap(gl.TEXTURE_2D);
  if(lastChop !== P.chop || lastSplat !== splat){
    lastChop = P.chop; lastSplat = splat; caustCalib = 2;
  }
  if(caustCalib > 0){ caustCalib--; calibrateCaustics(); }

  /* ---- pass 1: shadow map ----------------------------------------------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
  gl.viewport(0,0,SHADOW_SIZE,SHADOW_SIZE);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.CULL_FACE);
  clipOn=0;
  drawWorld(lightVP, {shadow:true, noCull:true});

  /* ---- pass 2: mirrored render for the surface -------------------------- */
  mirrorY(mirrorM, W.waterY);
  mul(viewR, view, mirrorM);
  mul(vpR, proj, viewR);
  gl.bindFramebuffer(gl.FRAMEBUFFER, reflFBO);
  gl.viewport(0,0,VW,VH);
  gl.clearColor(deepCol[0],deepCol[1],deepCol[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.CULL_FACE);
  clipOn=1; clipSign=1;                    // drop anything above the waterline
  drawWorld(vpR, {shadow:false, noCull:true});
  clipOn=0;

  /* ---- pass 3: main scene ----------------------------------------------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
  gl.viewport(0,0,RW,RH);
  gl.clearColor(deepCol[0],deepCol[1],deepCol[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.disable(gl.CULL_FACE);
  drawWorld(vp, {shadow:false, noCull:true});

  /* ---- pass 4: transparents --------------------------------------------- */
  // copy the opaque frame so bubbles can refract it
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, sceneFBO);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, refrFBO);
  gl.blitFramebuffer(0,0,RW,RH, 0,0,RW,RH, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
  gl.viewport(0,0,RW,RH);

  // water surface
  gl.useProgram(progWater.p);
  gl.uniformMatrix4fv(progWater.u.uVP,false,vp);
  gl.uniform1f(progWater.u.uChop, P.chop);
  setCommon(progWater);
  gl.uniform2f(progWater.u.uRes, RW, RH);
  bindTex(progWater,'uReflect',3,reflTex);
  gl.bindVertexArray(water.vao);
  gl.drawElements(gl.TRIANGLES, water.count, gl.UNSIGNED_INT, 0);

  drawFins(vp);

  // camera basis for billboards
  const fwd=camFwd;
  const right=[fwd[2],0,-fwd[0]];
  { const l=Math.hypot(...right)||1; right[0]/=l; right[1]/=l; right[2]/=l; }
  const upv=[right[1]*fwd[2]-right[2]*fwd[1], right[2]*fwd[0]-right[0]*fwd[2], right[0]*fwd[1]-right[1]*fwd[0]];

  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);

  if(food.length){
    gl.useProgram(progFood.p);
    gl.uniformMatrix4fv(progFood.u.uVP,false,vp);
    setCommon(progFood);
    gl.uniform3fv(progFood.u.uRight, right); gl.uniform3fv(progFood.u.uUp, upv);
    gl.bindVertexArray(foodGL.vao);
    gl.drawArraysInstanced(gl.TRIANGLES,0,6,food.length);
  }
  if(nSnow>0){
    gl.useProgram(progSnow.p);
    gl.uniformMatrix4fv(progSnow.u.uVP,false,vp);
    setCommon(progSnow);
    gl.uniform2f(progSnow.u.uRes, RW, RH);
    gl.bindVertexArray(snowGL.vao);
    gl.drawArrays(gl.POINTS,0,nSnow);
  }
  if(bubbles.length){
    gl.useProgram(progBubble.p);
    gl.uniformMatrix4fv(progBubble.u.uVP,false,vp);
    setCommon(progBubble);
    gl.uniform3fv(progBubble.u.uRight, right); gl.uniform3fv(progBubble.u.uUp, upv);
    gl.uniform2f(progBubble.u.uRes, RW, RH);
    bindTex(progBubble,'uScene',4,refrTex);
    gl.bindVertexArray(bubbleGL.vao);
    gl.drawArraysInstanced(gl.TRIANGLES,0,6,bubbles.length);
  }
  gl.depthMask(true); gl.disable(gl.BLEND);

  /* ---- pass 5: volumetric shafts ---------------------------------------- */
  fullscreen(progVol, volFBO, VW, VH);
  setCommon(progVol);
  gl.uniformMatrix4fv(progVol.u.uInvVP,false,invVP);
  gl.uniform1f(progVol.u.uNear,NEAR); gl.uniform1f(progVol.u.uFar,FAR);
  gl.uniform1f(progVol.u.uDensity, 0.042 + (1-P.clarity)*0.10);
  gl.uniform1f(progVol.u.uSandY, W.sandY);
  gl.uniform3f(progVol.u.uCamFwd, camFwd[0], camFwd[1], camFwd[2]);
  gl.uniform2f(progVol.u.uRes, VW, VH);
  bindTex(progVol,'uDepth',5,sceneDepth);
  gl.drawArrays(gl.TRIANGLES,0,3);

  /* ---- pass 6: dof + bloom ---------------------------------------------- */
  fullscreen(progBlur, dofAF, VW, VH);
  bindTex(progBlur,'uTex',0,sceneTex);
  gl.uniform2f(progBlur.u.uDir, 1.7/VW, 0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  fullscreen(progBlur, dofBF, VW, VH);
  bindTex(progBlur,'uTex',0,dofA);
  gl.uniform2f(progBlur.u.uDir, 0, 1.7/VH);
  gl.drawArrays(gl.TRIANGLES,0,3);
  fullscreen(progBlur, dofAF, VW, VH);
  bindTex(progBlur,'uTex',0,dofB);
  gl.uniform2f(progBlur.u.uDir, 3.9/VW, 0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  fullscreen(progBlur, dofBF, VW, VH);
  bindTex(progBlur,'uTex',0,dofA);
  gl.uniform2f(progBlur.u.uDir, 0, 3.9/VH);
  gl.drawArrays(gl.TRIANGLES,0,3);

  fullscreen(progBright, brightFBO, BW, BH);
  bindTex(progBright,'uTex',0,sceneTex);
  gl.uniform1f(progBright.u.uThreshold, 0.75);
  gl.drawArrays(gl.TRIANGLES,0,3);
  fullscreen(progBlur, blurFBO, BW, BH);
  bindTex(progBlur,'uTex',0,brightTex);
  gl.uniform2f(progBlur.u.uDir, 1.6/BW, 0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  fullscreen(progBlur, brightFBO, BW, BH);
  bindTex(progBlur,'uTex',0,blurTex);
  gl.uniform2f(progBlur.u.uDir, 0, 1.6/BH);
  gl.drawArrays(gl.TRIANGLES,0,3);
  fullscreen(progBlur, blurFBO, BW, BH);
  bindTex(progBlur,'uTex',0,brightTex);
  gl.uniform2f(progBlur.u.uDir, 3.0/BW, 0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  fullscreen(progBlur, brightFBO, BW, BH);
  bindTex(progBlur,'uTex',0,blurTex);
  gl.uniform2f(progBlur.u.uDir, 0, 3.0/BH);
  gl.drawArrays(gl.TRIANGLES,0,3);

  /* ---- pass 7: composite ------------------------------------------------ */
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,cv.width,cv.height);
  gl.useProgram(progComposite.p);
  gl.disable(gl.DEPTH_TEST);
  gl.bindVertexArray(quadVAO);
  bindTex(progComposite,'uScene',0,sceneTex);
  bindTex(progComposite,'uBloom',1,brightTex);
  bindTex(progComposite,'uVol',2,volTex);
  bindTex(progComposite,'uBlur',3,dofB);
  bindTex(progComposite,'uDepth',4,sceneDepth);
  gl.uniform2f(progComposite.u.uRes, cv.width, cv.height);
  gl.uniform2f(progComposite.u.uTexel, 1/RW, 1/RH);
  gl.uniform1f(progComposite.u.uTime, T);
  gl.uniform1f(progComposite.u.uBloomAmt, P.bloom*0.6);
  gl.uniform1f(progComposite.u.uGodAmt, P.godrays);
  gl.uniform1f(progComposite.u.uDofAmt, P.dof);
  const fdist = Math.hypot(cam.target[0]-cam.pos[0], cam.target[1]-cam.pos[1], cam.target[2]-cam.pos[2]);
  gl.uniform1f(progComposite.u.uFocus, fdist*1.05);
  gl.uniform1f(progComposite.u.uNear,NEAR); gl.uniform1f(progComposite.u.uFar,FAR);
  gl.uniform1f(progComposite.u.uExposure, P.exposure);
  gl.uniform1f(progComposite.u.uVignette, 0.34);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindVertexArray(null);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
