<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MonsterBrush 🦷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #FFB3DE;
    --blue: #B3E5FC;
    --green: #C8E6C9;
    --yellow: #FFF9C4;
    --purple: #E1BEE7;
    --shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Fredoka One', cursive, sans-serif;
    background: linear-gradient(135deg, #e8d5f5 0%, #d0f0e8 100%);
  }

  /* ── SCREENS ── */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .screen.hidden {
    opacity: 0; visibility: hidden; pointer-events: none; transform: scale(0.97);
  }

  /* ── SELECT SCREEN ── */
  #select-screen {
    background: linear-gradient(160deg, #f0d9ff 0%, #d0f5e8 100%);
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    gap: 16px;
    overflow-y: auto;
  }

  .select-title {
    font-size: clamp(28px, 6vw, 48px);
    color: #7B5EA7;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
    text-align: center;
  }

  .monster-cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 1100px;
  }

  .monster-card {
    background: white;
    border-radius: 28px;
    padding: 10px;
    width: 100%;
    font-family: inherit;
    display: flex; flex-direction: column;
    align-items: center; gap: 12px;
    box-shadow: var(--shadow);
    cursor: pointer;
    animation: float 3s ease-in-out infinite;
    transition: transform 0.15s, box-shadow 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .monster-card:nth-child(2) { animation-delay: 0.4s; }
  .monster-card:nth-child(3) { animation-delay: 0.8s; }
  .monster-card:nth-child(4) { animation-delay: 1.2s; }
  .monster-card:focus-visible, button:focus-visible { outline: 4px solid #7B5EA7; outline-offset: 4px; }

  .monster-card:active { transform: scale(0.93) !important; }
  .monster-card:hover  { transform: scale(1.04); box-shadow: 0 10px 32px rgba(0,0,0,0.2); }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-10px); }
  }

  .monster-card img {
    width: 100%; aspect-ratio: 2/3;
    object-fit: cover;
    border-radius: 18px;
    display: block;
  }

  .monster-card .card-name {
    font-size: clamp(18px, 3.5vw, 26px);
    color: #555;
  }

  .bedtime-btn { border: 0; border-radius: 50%; background: #ffffffb3; width: 52px; height: 52px; font-size: 28px; cursor: pointer; flex-shrink: 0; }
  #select-screen.bedtime { background: linear-gradient(160deg, #353458, #555b7d); }
  .bedtime .select-title { color: #fff4cf; text-shadow: none; }
  .bedtime .monster-card { animation: none; box-shadow: 0 0 22px #fff4cf33; }
  .monster-card.waving { animation: goodnight-wave 0.9s ease-in-out; }
  @keyframes goodnight-wave { 0%, 100% { transform: rotate(0); } 25%, 75% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  /* ── BRUSH SCREEN ── */
  #brush-screen {
    background: linear-gradient(160deg, #fce4f4 0%, #e3f2fd 100%);
    padding: 0;
    justify-content: flex-start;
  }

  .top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 16px 8px;
    flex-shrink: 0;
  }

  .back-btn {
    background: white;
    border: none;
    border-radius: 50%;
    width: 52px; height: 52px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn:active { transform: scale(0.88); }

  .center-label {
    font-size: clamp(18px, 4vw, 28px);
    color: #7B5EA7;
    text-align: center;
    flex: 1;
  }

  /* Timer */
  .timer-wrap {
    position: relative;
    width: 52px; height: 52px;
    flex-shrink: 0;
  }
  .timer-svg { width: 52px; height: 52px; transform: rotate(-90deg); }
  .timer-track { fill: none; stroke: #e0e0e0; stroke-width: 4; }
  .timer-ring  { fill: none; stroke: #FFB3DE; stroke-width: 4; stroke-linecap: round;
                 stroke-dasharray: 138; stroke-dashoffset: 0;
                 transition: stroke-dashoffset 1s linear, stroke 0.5s; }
  .timer-text  {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #7B5EA7; font-family: 'Fredoka One', cursive;
    pointer-events: none;
  }

  /* Viewport */
  .viewport-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
  }

  .monster-viewport {
    position: relative;
    width: min(94vw, calc((100dvh - 190px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 2 / 3));
    aspect-ratio: 2/3;
    overflow: hidden;
    border-radius: 24px;
    cursor: none;
  }

  .monster-art { position: absolute; inset: 0; }

  .clean-layer {
    display: block;
    width: 100%; height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  #brush-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    touch-action: none;
  }

  /* Bottom bar */
  .bottom-bar {
    width: 100%;
    padding: 10px 16px max(16px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .btn-row {
    display: flex;
    gap: 14px;
  }

  .btn {
    border: none;
    border-radius: 40px;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(18px, 4vw, 26px);
    padding: 14px 32px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s;
    min-height: 60px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.91); box-shadow: 0 2px 8px rgba(0,0,0,0.12); }

  .btn-restart { background: var(--yellow); color: #8D6E00; }
  .btn-done    { background: #A5D6A7; color: #2E7D32; }
  .clean-progress { width: min(240px, 65vw); height: 10px; border-radius: 8px; background: #ffffffb3; overflow: hidden; }
  .clean-progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #b6dedc, #8bcd9c); border-radius: inherit; transition: width .2s; }

  /* ── CUSTOM CURSOR ── */
  #cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    display: none;
    transform-origin: center center;
    will-change: transform;
  }
  #cursor svg { width: 56px; height: 56px; transform: rotate(45deg); }
  #cursor.brushing { animation: wobble 0.12s ease-in-out infinite alternate; }

  @keyframes wobble {
    from { transform: rotate(-6deg); }
    to   { transform: rotate(6deg); }
  }

  /* ── SPARKLES ── */
  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    font-size: 16px;
    animation: sparkle-up 0.5s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes sparkle-up {
    0%   { transform: translate(0, 0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(1.4); opacity: 0; }
  }

  /* ── CELEBRATION ── */
  #celebration {
    position: fixed; inset: 0;
    z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    padding: 24px;
    background: rgba(100, 50, 160, 0.72);
    backdrop-filter: blur(4px);
    animation: fadein 0.4s ease;
  }
  #celebration.hidden { display: none; }

  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  .celeb-img {
    width: min(280px, 65vw);
    height: min(280px, 65vw);
    object-fit: contain;
    border-radius: 28px;
    animation: pulse-glow 1.5s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(255,255,255,0.8);
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 20px 4px rgba(255,220,255,0.6); }
    50%       { box-shadow: 0 0 50px 20px rgba(255,220,255,0.9); }
  }

  .celeb-title {
    font-size: clamp(32px, 8vw, 60px);
    color: white;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    animation: bounce-in 0.5s cubic-bezier(.36,1.6,.4,1) both;
    text-align: center;
  }
  @keyframes bounce-in {
    from { opacity: 0; transform: scale(0.4); }
    to   { opacity: 1; transform: scale(1); }
  }

  .celeb-btns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .btn-play-again  { background: #FFB3DE; color: #8B0053; }
  .btn-choose-other { background: white;   color: #7B5EA7; }

  /* confetti */
  .confetti-piece {
    position: fixed;
    pointer-events: none;
    z-index: 101;
    border-radius: 3px;
    animation: confetti-fall var(--dur) ease-in var(--delay) forwards;
    will-change: transform, opacity;
  }
  @keyframes confetti-fall {
    0%   { transform: translate(0, -20px) rotate(0deg);   opacity: 1; }
    100% { transform: translate(var(--cx), var(--cy)) rotate(var(--cr)); opacity: 0; }
  }

  /* ── RESPONSIVE ── */
  @media (max-height: 600px) {
    .top-bar { padding: 6px 12px 4px; }
    .bottom-bar { padding: 6px 12px 10px; gap: 6px; }
    .btn { padding: 10px 24px; font-size: 18px; min-height: 50px; }
  }

  @media (max-width: 700px) {
    .monster-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: min(500px, calc((100dvh - 168px) * .93)); }
    .monster-card { padding: 6px; border-radius: 20px; gap: 5px; }
    .monster-card img { aspect-ratio: 1; object-position: center 43%; border-radius: 13px; }
    .monster-card .card-name { font-size: 18px; }
    .select-title { font-size: 28px; }
  }
  @media (max-width: 600px), (max-height: 500px) {
    .monster-viewport { width: min(calc(100vw - 24px), calc((100dvh - 184px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) / 1.1)); aspect-ratio: 1/1.1; }
    .monster-art { inset: auto; width: 145%; aspect-ratio: 2/3; left: 50%; top: 50%; transform: translate(-50%, calc(-1 * var(--face-y, 50%))); }
    .center-label { font-size: 18px; }
    .btn { padding: 12px 20px; min-height: 52px; font-size: 18px; }
  }
  @media (max-height: 500px) and (min-width: 601px) {
    #select-screen { gap: 10px; }
    .monster-cards { max-width: calc((100dvh - 150px) * 3); }
    .select-title { font-size: 24px; }
    .monster-card { padding: 5px; gap: 5px; }
    .monster-card img { aspect-ratio: 1; object-position: center 43%; }
    .monster-card .card-name { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     SCREEN 1: CHARACTER SELECT
════════════════════════════════════════════ -->
<div id="select-screen" class="screen">
  <h1 class="select-title" id="select-title">Who needs a brushing? 🦷</h1>
  <div class="monster-cards" id="monster-cards"></div>
  <button class="bedtime-btn" id="bedtime-btn" aria-label="Wave good night" aria-pressed="false">🌙</button>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 2: BRUSH SCREEN
════════════════════════════════════════════ -->
<div id="brush-screen" class="screen hidden">
  <div class="top-bar">
    <button class="back-btn" id="back-btn" aria-label="Back">←</button>
    <span class="center-label" id="brush-label">Time to brush! 🪥</span>
    <div class="timer-wrap" id="timer-wrap">
      <svg class="timer-svg" viewBox="0 0 48 48">
        <circle class="timer-track" cx="24" cy="24" r="22"/>
        <circle class="timer-ring"  cx="24" cy="24" r="22" id="timer-ring"/>
      </svg>
      <div class="timer-text" id="timer-text">0:30</div>
    </div>
  </div>

  <div class="viewport-wrap">
    <div class="monster-viewport" id="monster-viewport">
      <div class="monster-art" id="monster-art">
        <img class="clean-layer" id="clean-img" alt="clean monster" draggable="false">
        <canvas id="brush-canvas" aria-label="Brush the monster's teeth"></canvas>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="clean-progress" role="progressbar" aria-label="Teeth cleaned" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="clean-progress"><div class="clean-progress-fill" id="clean-progress-fill"></div></div>
    <div class="btn-row">
      <button class="btn btn-restart" id="restart-btn">↺ Restart</button>
      <button class="btn btn-done"    id="done-btn">✓ All Done!</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 3: CELEBRATION OVERLAY
════════════════════════════════════════════ -->
<div id="celebration" class="hidden" role="dialog" aria-modal="true" aria-label="Squeaky clean" inert>
  <img id="celeb-img" alt="clean monster" class="celeb-img">
  <div class="celeb-title">Squeaky Clean! ⭐</div>
  <div class="celeb-btns">
    <button class="btn btn-play-again"   id="play-again-btn">Play Again</button>
    <button class="btn btn-choose-other" id="choose-other-btn">Choose Another</button>
  </div>
</div>

<!-- Custom cursor -->
<div id="cursor">
  <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- handle -->
    <rect x="28" y="36" width="8" height="22" rx="4" fill="#B0BEC5"/>
    <!-- head -->
    <rect x="22" y="8"  width="20" height="28" rx="6" fill="white" stroke="#90CAF9" stroke-width="2"/>
    <!-- bristles -->
    <rect x="24" y="10" width="3" height="14" rx="1.5" fill="#81D4FA"/>
    <rect x="30" y="10" width="3" height="14" rx="1.5" fill="#FFB3DE"/>
    <rect x="36" y="10" width="3" height="14" rx="1.5" fill="#A5D6A7"/>
    <!-- toothpaste blob -->
    <circle cx="25" cy="9" r="3" fill="#FFE082"/>
  </svg>
</div>

<script>
'use strict';

/* ══════════════════════════════════════════
   DATA
════════════════════════════════════════════ */
const MONSTERS = [
  { id: 1, name: 'Fluffy', mouth: [.34, .425, .32, .105], faceY: 46, color: '#FFB3DE', clean: 'monsterbrush/monster1_clean.avif', dirty: 'monsterbrush/monster1_dirty.avif' },
  { id: 2, name: 'Pajamas', mouth: [.27, .49, .46, .14], faceY: 53, color: '#B3E5FC', clean: 'monsterbrush/monster2_clean.avif', dirty: 'monsterbrush/monster2_dirty.avif' },
  { id: 3, name: 'Zapper', mouth: [.16, .45, .68, .26], faceY: 53, color: '#C8E6C9', clean: 'monsterbrush/monster3_clean.avif', dirty: 'monsterbrush/monster3_dirty.avif' },
  { id: 4, name: 'Pumpkin', mouth: [.34, .405, .32, .11], faceY: 46, color: '#FFD8B1', clean: 'monsterbrush/monster4_clean.avif', dirty: 'monsterbrush/monster4_dirty.avif' },
];

const BRUSH_RADIUS   = 36;   // screen px; consistent on phones and tablets
const BRUSH_CENTER_ALPHA = 0.6;
const BRUSH_MID_ALPHA = 0.28;
const CELEBRATE_AT   = 0.99; // 99% of the original tooth dirt removed
const SAMPLE_INTERVAL = 200; // ms
const TIMER_SECS     = 30;
const CLEAN_FOR_MS   = 6 * 60 * 60 * 1000;
const STORAGE_KEY    = 'monsterbrush-clean-until-v1';
const SPARKLE_CHARS  = ['✦', '✧', '★', '⭐', '💧', '·', '•'];
const PASTEL_COLORS  = ['#FFB3DE','#B3E5FC','#C8E6C9','#FFF9C4','#E1BEE7','#FFD8B1'];

/* ══════════════════════════════════════════
   STATE
════════════════════════════════════════════ */
let currentMonster  = null;
const imageCache = new Map();
let isDrawing       = false;
let celebrated      = false;
let timerInterval   = null;
let timerRemaining  = TIMER_SECS;
let sampleTimeout   = null;
let rafPending      = false;
let cursorX = 0, cursorY = 0;
let ready = false;
let sessionToken = 0;
let lastBrushPos = null;
let activePointer = null;
let toothSamples = [];
let originalDirt = 0;
let mouthRect = null;
let bedtime = false;
let cleanUntil = readCleanUntil();

/* ══════════════════════════════════════════
   DOM REFS
════════════════════════════════════════════ */
const selectScreen  = document.getElementById('select-screen');
const brushScreen   = document.getElementById('brush-screen');
const celebration   = document.getElementById('celebration');
const monsterCards  = document.getElementById('monster-cards');
const brushLabel    = document.getElementById('brush-label');
const cleanImg      = document.getElementById('clean-img');
const brushCanvas   = document.getElementById('brush-canvas');
const ctx           = brushCanvas.getContext('2d', { willReadFrequently: true });
const backBtn       = document.getElementById('back-btn');
const restartBtn    = document.getElementById('restart-btn');
const doneBtn       = document.getElementById('done-btn');
const playAgainBtn  = document.getElementById('play-again-btn');
const chooseOtherBtn= document.getElementById('choose-other-btn');
const timerText     = document.getElementById('timer-text');
const timerRing     = document.getElementById('timer-ring');
const cursorEl      = document.getElementById('cursor');
const celebImg      = document.getElementById('celeb-img');
const viewport      = document.getElementById('monster-viewport');
const monsterArt    = document.getElementById('monster-art');
const selectTitle   = document.getElementById('select-title');
const bedtimeBtn    = document.getElementById('bedtime-btn');
const cleanProgress = document.getElementById('clean-progress');
const progressFill  = document.getElementById('clean-progress-fill');

const RING_C = 2 * Math.PI * 22; // circumference ≈ 138

/* ══════════════════════════════════════════
   BUILD SELECT SCREEN
════════════════════════════════════════════ */
function readCleanUntil() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    const now = Date.now();
    return Object.fromEntries(MONSTERS.map(m => [m.id, saved?.[m.id]])
      .filter(([, until]) => Number.isFinite(until) && until > now && until <= now + CLEAN_FOR_MS));
  } catch { return {}; }
}

function rememberClean(monster) {
  cleanUntil[monster.id] = Date.now() + CLEAN_FOR_MS;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanUntil)); } catch { /* Memory still works without storage. */ }
  updateSelectScreen();
}

function updateSelectScreen() {
  const now = Date.now();
  const allClean = MONSTERS.every(m => cleanUntil[m.id] > now);
  selectTitle.textContent = bedtime ? 'Good night, little monsters 🌙' : allClean ? 'Happy, shiny smiles! ✨' : 'Who needs a brushing? 🦷';
  MONSTERS.forEach(m => {
    const card = monsterCards.querySelector(`[data-id="${m.id}"]`);
    if (!card) return;
    const isClean = cleanUntil[m.id] > now;
    card.querySelector('img').src = bedtime || isClean ? m.clean : m.dirty;
    card.setAttribute('aria-label', bedtime ? `Wave good night to ${m.name}` : `${m.name}${isClean ? ', freshly brushed' : ', time to brush'}`);
  });
}

function buildSelectScreen() {
  MONSTERS.forEach(m => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'monster-card';
    card.dataset.id = m.id;
    const img = document.createElement('img');
    img.alt = m.name;
    img.draggable = false;
    const name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = m.name;
    card.append(img, name);
    card.style.border = `3px solid ${m.color}`;
    card.addEventListener('click', () => {
      if (bedtime) {
        card.classList.remove('waving');
        void card.offsetWidth;
        card.classList.add('waving');
      } else {
        startBrush(m);
      }
    });
    card.addEventListener('animationend', () => card.classList.remove('waving'));
    monsterCards.appendChild(card);
  });
  updateSelectScreen();
}

function loadImage(src) {
  if (!imageCache.has(src)) {
    const promise = new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error(`Unable to load ${src}`));
      img.src = src;
    });
    imageCache.set(src, promise);
    promise.catch(() => imageCache.delete(src));
  }
  return imageCache.get(src);
}

/* ══════════════════════════════════════════
   SCREEN TRANSITIONS
════════════════════════════════════════════ */
function showScreen(el) {
  [selectScreen, brushScreen].forEach(s => s.classList.add('hidden'));
  el.classList.remove('hidden');
  [selectScreen, brushScreen].forEach(s => { s.inert = s !== el; });
  if (el === selectScreen) updateSelectScreen();
}

/* ══════════════════════════════════════════
   BRUSH SCREEN
════════════════════════════════════════════ */
async function startBrush(monster) {
  stopSession();
  hideCelebration();
  const token = sessionToken;
  currentMonster = monster;
  celebrated = false;
  setProgress(0);
  timerRemaining = TIMER_SECS;
  updateTimerDisplay();
  brushLabel.textContent = `${monster.name} 🪥`;
  monsterArt.style.setProperty('--face-y', `${monster.faceY}%`);
  cleanImg.src = monster.clean;
  cleanImg.alt = `${monster.name} with clean teeth`;
  celebImg.src = monster.clean;
  celebImg.alt = `${monster.name} with clean teeth`;
  restartBtn.disabled = doneBtn.disabled = true;
  showScreen(brushScreen);
  backBtn.focus({ preventScroll: true });
  try {
    const [dirty, clean] = await Promise.all([loadImage(monster.dirty), loadImage(monster.clean)]);
    if (token !== sessionToken) return;
    // Keep the backing canvas independent of the display crop. Rotating a phone
    // or resizing a window must never put the dirt back.
    brushCanvas.width = clean.naturalWidth;
    brushCanvas.height = clean.naturalHeight;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(dirty, 0, 0, brushCanvas.width, brushCanvas.height);
    buildToothSamples(monster, clean);
    ready = true;
    restartBtn.disabled = doneBtn.disabled = false;
    resetTimer();
  } catch {
    if (token !== sessionToken) return;
    brushLabel.textContent = 'Picture is taking a nap. Try again!';
    restartBtn.disabled = false;
  }
}

function buildToothSamples(monster, clean) {
  const [x, y, w, h] = monster.mouth;
  mouthRect = {
    x: Math.floor(x * brushCanvas.width), y: Math.floor(y * brushCanvas.height),
    w: Math.ceil(w * brushCanvas.width), h: Math.ceil(h * brushCanvas.height),
  };
  const reference = document.createElement('canvas');
  reference.width = brushCanvas.width;
  reference.height = brushCanvas.height;
  const referenceCtx = reference.getContext('2d');
  referenceCtx.drawImage(clean, 0, 0, reference.width, reference.height);
  const cleanData = referenceCtx.getImageData(mouthRect.x, mouthRect.y, mouthRect.w, mouthRect.h).data;
  const dirtyData = ctx.getImageData(mouthRect.x, mouthRect.y, mouthRect.w, mouthRect.h).data;
  toothSamples = [];
  originalDirt = 0;
  for (let i = 0; i < cleanData.length; i += 16) {
    const r = cleanData[i], g = cleanData[i + 1], b = cleanData[i + 2];
    // White tooth surfaces only, inside this monster's mouth. Ignore the
    // background, gums and minor compression differences between the pair.
    if (Math.min(r, g, b) < 135 || Math.max(r, g, b) - Math.min(r, g, b) > 75) continue;
    const delta = Math.abs(r - dirtyData[i]) + Math.abs(g - dirtyData[i + 1]) + Math.abs(b - dirtyData[i + 2]);
    const weight = Math.max(0, delta - 30);
    if (!weight) continue;
    toothSamples.push([i + 3, weight]);
    originalDirt += weight;
  }
}

function getCanvasPos(clientX, clientY) {
  const rect = brushCanvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * brushCanvas.width / rect.width,
    y: (clientY - rect.top) * brushCanvas.height / rect.height,
    radius: BRUSH_RADIUS * brushCanvas.width / rect.width,
  };
}

function brush(clientX, clientY) {
  const pos = getCanvasPos(clientX, clientY);
  const from = lastBrushPos || pos;
  const steps = Math.max(1, Math.ceil(Math.hypot(pos.x - from.x, pos.y - from.y) / (pos.radius * 0.25)));
  ctx.globalCompositeOperation = 'destination-out';
  for (let step = 1; step <= steps; step++) {
    const x = from.x + (pos.x - from.x) * step / steps;
    const y = from.y + (pos.y - from.y) * step / steps;
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, pos.radius);
    gradient.addColorStop(0, `rgba(0,0,0,${BRUSH_CENTER_ALPHA})`);
    gradient.addColorStop(0.55, `rgba(0,0,0,${BRUSH_MID_ALPHA})`);
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, pos.radius, 0, Math.PI * 2);
    ctx.fill();
  }
  lastBrushPos = pos;
}

function scheduleSample() {
  if (sampleTimeout) return;
  sampleTimeout = setTimeout(() => {
    sampleTimeout = null;
    if (ready && !celebrated) checkProgress();
  }, SAMPLE_INTERVAL);
}

function setProgress(ratio) {
  const percent = Math.round(Math.max(0, Math.min(1, ratio)) * 100);
  progressFill.style.width = `${percent}%`;
  cleanProgress.setAttribute('aria-valuenow', percent);
}

function checkProgress() {
  if (!originalDirt || !ready || celebrated) return;
  const data = ctx.getImageData(mouthRect.x, mouthRect.y, mouthRect.w, mouthRect.h).data;
  let remainingDirt = 0;
  for (const [alphaIndex, weight] of toothSamples) remainingDirt += weight * data[alphaIndex] / 255;
  const ratio = 1 - remainingDirt / originalDirt;
  setProgress(ratio);
  if (ratio >= CELEBRATE_AT) celebrate();
}

function endStroke() {
  isDrawing = false;
  lastBrushPos = null;
  if (activePointer !== null && brushCanvas.hasPointerCapture(activePointer)) brushCanvas.releasePointerCapture(activePointer);
  activePointer = null;
  cursorEl.classList.remove('brushing');
  hideCursorEl();
}

function stopSession() {
  ready = false;
  ++sessionToken;
  clearInterval(timerInterval);
  clearTimeout(sampleTimeout);
  sampleTimeout = null;
  endStroke();
}

/* ══════════════════════════════════════════
   TIMER
════════════════════════════════════════════ */
function resetTimer() {
  clearInterval(timerInterval);
  timerRemaining = TIMER_SECS;
  updateTimerDisplay();
  timerInterval = setInterval(tickTimer, 1000);
}

function tickTimer() {
  timerRemaining = Math.max(0, timerRemaining - 1);
  updateTimerDisplay();
  if (timerRemaining <= 0) {
    clearInterval(timerInterval);
    brushLabel.textContent = 'Keep making sparkly smiles! ✨';
  }
}

function updateTimerDisplay() {
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  timerText.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  const progress = 1 - (timerRemaining / TIMER_SECS);
  timerRing.style.strokeDashoffset = RING_C * progress;
  // color shift: pink → green
  const hue = Math.round(progress * 120);
  timerRing.style.stroke = `hsl(${hue}, 70%, 65%)`;
}

/* ══════════════════════════════════════════
   CELEBRATION
════════════════════════════════════════════ */
function celebrate() {
  if (celebrated || !ready) return;
  celebrated = true;
  stopSession();
  ctx.clearRect(0, 0, brushCanvas.width, brushCanvas.height);
  setProgress(1);
  rememberClean(currentMonster);
  celebration.classList.remove('hidden');
  celebration.inert = false;
  brushScreen.inert = true;
  chooseOtherBtn.focus({ preventScroll: true });
  spawnConfetti();
}

function hideCelebration() {
  celebration.classList.add('hidden');
  celebration.inert = true;
  clearConfetti();
}

function spawnConfetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#FFB3DE','#B3E5FC','#C8E6C9','#FFF9C4','#E1BEE7','#FF8A65','#80CBC4'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 8 + Math.random() * 10;
    const startX = Math.random() * window.innerWidth;
    const cx = (Math.random() - 0.5) * 300;
    const cy = window.innerHeight * 0.5 + Math.random() * window.innerHeight * 0.6;
    const rot = (Math.random() - 0.5) * 720;
    el.style.cssText = `
      left: ${startX}px; top: 0;
      width: ${size}px; height: ${size * (0.5 + Math.random())}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      --cx: ${cx}px; --cy: ${cy}px; --cr: ${rot}deg;
      --dur: ${1.2 + Math.random() * 1.6}s;
      --delay: ${Math.random() * 0.8}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

function clearConfetti() {
  document.querySelectorAll('.confetti-piece').forEach(e => e.remove());
}

/* ══════════════════════════════════════════
   SPARKLES
════════════════════════════════════════════ */
function spawnSparkles(clientX, clientY) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const count = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.textContent = SPARKLE_CHARS[Math.floor(Math.random() * SPARKLE_CHARS.length)];
    el.style.cssText = `
      left: ${clientX - 8}px; top: ${clientY - 8}px;
      color: ${PASTEL_COLORS[Math.floor(Math.random() * PASTEL_COLORS.length)]};
      --sx: ${(Math.random() - 0.5) * 60}px;
      --sy: ${-(20 + Math.random() * 40)}px;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

/* ══════════════════════════════════════════
   CURSOR
════════════════════════════════════════════ */
function showCursor(x, y) {
  cursorEl.style.display = 'block';
  cursorEl.style.left = (x - 28) + 'px';
  cursorEl.style.top  = (y - 28) + 'px';
}
function hideCursorEl() { cursorEl.style.display = 'none'; }

function moveCursor(x, y) {
  cursorX = x; cursorY = y;
  if (!rafPending) {
    rafPending = true;
    requestAnimationFrame(() => {
      if (ready && !celebrated && !brushScreen.classList.contains('hidden')) showCursor(cursorX, cursorY);
      rafPending = false;
    });
  }
}

/* ══════════════════════════════════════════
   CANVAS EVENT HANDLERS
════════════════════════════════════════════ */
let lastSparkle = 0;

function handleBrush(clientX, clientY) {
  if (!isDrawing || !ready || celebrated) return;
  brush(clientX, clientY);
  moveCursor(clientX, clientY);
  const now = Date.now();
  if (now - lastSparkle > 60) {
    spawnSparkles(clientX, clientY);
    lastSparkle = now;
  }
  scheduleSample();
}

// Pointer capture keeps swipes working even when a little finger slips outside
// the picture. A tap cleans too, and a second finger cannot interrupt a stroke.
brushCanvas.addEventListener('pointerdown', e => {
  if (!ready || celebrated || activePointer !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  activePointer = e.pointerId;
  brushCanvas.setPointerCapture(e.pointerId);
  isDrawing = true;
  lastBrushPos = null;
  cursorEl.classList.add('brushing');
  handleBrush(e.clientX, e.clientY);
});
brushCanvas.addEventListener('pointermove', e => {
  if (e.pointerId === activePointer) handleBrush(e.clientX, e.clientY);
  else if (activePointer === null && e.pointerType === 'mouse') moveCursor(e.clientX, e.clientY);
});
brushCanvas.addEventListener('pointerup', e => {
  if (e.pointerId !== activePointer) return;
  endStroke();
  if (ready) checkProgress();
});
brushCanvas.addEventListener('pointercancel', e => { if (e.pointerId === activePointer) endStroke(); });
brushCanvas.addEventListener('lostpointercapture', e => { if (e.pointerId === activePointer) endStroke(); });
brushCanvas.addEventListener('pointerleave', () => { if (!isDrawing) hideCursorEl(); });
window.addEventListener('blur', endStroke);
// Discard the old stroke coordinate when the responsive crop changes.
window.addEventListener('resize', endStroke);

function returnToFriends() {
  stopSession();
  hideCelebration();
  showScreen(selectScreen);
  monsterCards.querySelector(`[data-id="${currentMonster?.id}"]`)?.focus({ preventScroll: true });
}
backBtn.addEventListener('click', returnToFriends);
restartBtn.addEventListener('click', () => startBrush(currentMonster));
doneBtn.addEventListener('click', celebrate);
playAgainBtn.addEventListener('click', () => startBrush(currentMonster));
chooseOtherBtn.addEventListener('click', returnToFriends);
bedtimeBtn.addEventListener('click', () => {
  bedtime = !bedtime;
  selectScreen.classList.toggle('bedtime', bedtime);
  bedtimeBtn.setAttribute('aria-pressed', bedtime);
  bedtimeBtn.setAttribute('aria-label', bedtime ? 'Back to brushing' : 'Wave good night');
  bedtimeBtn.textContent = bedtime ? '🪥' : '🌙';
  updateSelectScreen();
});
window.addEventListener('storage', e => {
  if (e.key === STORAGE_KEY || e.key === null) { cleanUntil = readCleanUntil(); updateSelectScreen(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) endStroke();
  else updateSelectScreen();
});
setInterval(updateSelectScreen, 60 * 1000);

MONSTERS.forEach(m => {
  loadImage(m.dirty).catch(() => {});
  loadImage(m.clean).catch(() => {});
});
buildSelectScreen();
showScreen(selectScreen);
</script>
</body>
</html>
